name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 GitHub Pages / 查询并纠正 Pages 配置
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      # 产物必须全部挂在 /small_daily/ 下：
      # calcury.github.io 的根目录是另一个仓库（用户站），根路径引用会互相干扰。
      - name: 校验产物路径都在 /small_daily/ 下
        run: npm run check:deploy

      # Pages 来源必须是「GitHub Actions」，否则工作流产物不会被发布，
      # 分支根目录反而会被原样当站点发出去（于是 index.html 里的 /src/main.tsx、
      # /manifest.webmanifest 全部 404）。
      #
      # 注意：GITHUB_TOKEN 即使带 pages:write，也无法把 legacy 站点切到 workflow
      # （PUT 会返回 403，需要仓库管理员 PAT）。所以这里不再"假装自愈"：
      #   - 若已配置 secrets.PAGES_ADMIN_TOKEN，则用它自动纠正；
      #   - 否则仅校验，来源不对时直接报错，避免"CI 绿、线上却是旧的"静默故障。
      - name: 校验 Pages 来源为 GitHub Actions
        env:
          ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          accept="Accept: application/vnd.github+json"
          ver="X-GitHub-Api-Version: 2022-11-28"
          read_type() {
            curl -sS -H "Authorization: Bearer $1" -H "$accept" -H "$ver" "$api" \
              | tr -d '\n' | grep -o '"build_type"[^,]*' | sed 's/.*"\([a-z]*\)"$/\1/'
          }

          echo "--- 当前 Pages 配置 ---"
          type=$(read_type "${GH_TOKEN}")
          echo "build_type = ${type:-<未知>}"

          if [ "$type" != "workflow" ] && [ -n "${ADMIN_TOKEN}" ]; then
            echo "--- 尝试用 PAGES_ADMIN_TOKEN 纠正为 workflow ---"
            code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" -H "$accept" -H "$ver" \
              "$api" -d '{"build_type":"workflow"}' || echo "000")
            echo "PUT HTTP ${code}"
            type=$(read_type "${ADMIN_TOKEN}")
            echo "build_type = ${type:-<未知>}"
          fi

          if [ "$type" != "workflow" ]; then
            echo "::error::Pages 来源为 '${type}'，工作流产物不会被发布。请到 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」；或为本仓库配置 secrets.PAGES_ADMIN_TOKEN（需 repo 权限的 PAT）后重跑。"
            exit 1
          fi
          echo "✓ Pages 来源为 GitHub Actions"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

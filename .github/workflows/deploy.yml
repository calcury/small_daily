name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 GitHub Pages / 查询并纠正 Pages 配置
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      # 产物必须全部挂在 /small_daily/ 下：
      # calcury.github.io 的根目录是另一个仓库（用户站），根路径引用会互相干扰。
      - name: 校验产物路径都在 /small_daily/ 下
        run: npm run check:deploy

      # 如果仓库的 Pages 被设成了「Deploy from a branch」，工作流产物不会被发布，
      # 分支根目录反而会被原样当站点发出去（于是 index.html 里的 /src/main.tsx、
      # /manifest.webmanifest 全部 404）。这里幂等地把它纠正为 workflow 构建。
      - name: 确保 Pages 使用 GitHub Actions 作为来源
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth="Authorization: Bearer ${GH_TOKEN}"
          accept="Accept: application/vnd.github+json"
          ver="X-GitHub-Api-Version: 2022-11-28"

          echo "--- 当前 Pages 配置 ---"
          curl -sS -H "$auth" -H "$accept" -H "$ver" "$api" || true
          echo
          echo "--- 设置为 workflow 构建 ---"
          code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT \
            -H "$auth" -H "$accept" -H "$ver" "$api" -d '{"build_type":"workflow"}' || echo "000")
          cat /tmp/pages-put.json 2>/dev/null || true
          echo
          echo "HTTP ${code}"
          case "$code" in
            2*) echo "✓ Pages 来源已确认为 GitHub Actions" ;;
            *)  echo "::warning::无法自动把 Pages 来源改成 GitHub Actions（HTTP ${code}）。请到 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」。" ;;
          esac

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
